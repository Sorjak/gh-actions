name: build-and-push
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_owner:
        required: true
        type: string
      build_args:
        required: false
        type: string
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # Grant write permissions for the GITHUB_TOKEN to commit and create a PR
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: source-repo

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.repo_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./source-repo
          push: true
          tags: ghcr.io/${{ inputs.repo_owner }}/${{ inputs.repo_name }}:${{ inputs.tag_name }}
          build-args: ${{ inputs.build_args }}